name: quality

on:
  push:
  pull_request:

# Read-only token for every job: nothing here publishes, comments, or tags.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: lint, types, tests, drift checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts eval
      - run: mypy src
      - run: pytest --cov=compliance_intelligence --cov-report=term-missing
      - run: python scripts/validate_source_manifest.py
      # The committed Pages artifact must be what the renderer produces from the
      # committed run tables; the committed eval report must be what the current
      # scorer produces (tests/test_eval_runner.py). Neither may be hand-edited.
      - run: python scripts/build_portfolio_walkthrough.py --check
      - name: tests must not modify tracked files
        run: git diff --exit-code

  container:
    name: container build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      # Builds the image and proves the two runtime contracts against it:
      # 503 with no verified snapshot, an exact hit with provenance once the
      # synthetic fixture is allowed. Same checks as scripts/smoke_docker.ps1.
      - run: bash scripts/smoke_docker.sh

  dependency-audit:
    name: dependency vulnerability audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Audits the runtime set that ships in the container plus the dev tools.
      # The [nlp]/[retrieval] extras are left out: the pinned spaCy model wheel
      # is a GitHub release asset with no advisory feed, so pip-audit reports a
      # skip for it rather than a result. --skip-editable covers the project
      # itself for the same reason.
      - run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install pip-audit
          python -m pip install -e ".[dev]"
          pip-audit --skip-editable --progress-spinner off

  secret-scan:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A secret that was committed and later removed is still in the
          # objects and still compromised; scanning only the tip would report
          # clean on exactly the case that matters.
          fetch-depth: 0
      - name: gitleaks (fails the build on any finding)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1 --verbose
