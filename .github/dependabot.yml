version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image tracks the interpreter series the project supports
      # (requires-python >=3.12,<3.14); patch updates to the image still arrive.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
