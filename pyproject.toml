[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-intelligence-platform"
version = "0.1.0"
description = "Auditable sanctions screening and public-document intelligence portfolio"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "defusedxml>=0.7,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "rapidfuzz>=3.9,<4",
  "rank-bm25>=0.2,<1",
  "uvicorn[standard]>=0.34,<1",
]

# Heavy NLP/retrieval dependencies are extras so the API container stays slim;
# the pinned model wheel makes installs reproducible (spacy download is not).
[project.optional-dependencies]
nlp = [
  "spacy>=3.8,<4",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]
retrieval = [
  "sentence-transformers>=3.3,<6",
  "numpy>=1.26,<3",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]
all = [
  "compliance-intelligence-platform[nlp,retrieval,dev]",
]

[project.scripts]
compliance-intelligence = "compliance_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "requires_models: needs the [nlp]/[retrieval] extras and their models installed",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["compliance_intelligence"]

[[tool.mypy.overrides]]
module = ["defusedxml.*", "rank_bm25", "sentence_transformers.*", "spacy.*", "en_core_web_sm"]
ignore_missing_imports = true

